name: Deploy to Vercel

# When to run: On push to dev or master branch
on:
  push:
    branches:
      - dev
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get the code from GitHub
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # Step 3: Install all dependencies
      - name: Install Dependencies
        run: npm ci

      # Step 4: Deploy to Vercel
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: ${{ github.ref == 'refs/heads/master' && '--prod' || '' }}
          working-directory: ./

      # Step 5: Show deployment URL
      - name: Show Deployment URL
        run: echo "Deployed successfully! Check your Vercel dashboard."
        - name: Deploy to Vercel
          run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --debug